<html lang="pt-BR">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copa do Mundo 2026 🏆</title>
<style>
:root{--g:#00843D;--gd:#005C2A;--gl:#E8F5EE;--gold:#FFD700;--red:#E53935;--bg:#fff;--bg2:#f4f4f4;--bd:rgba(0,0,0,.09);--tx:#1a1a1a;--mu:#666;--r:8px;--rl:14px}
@media(prefers-color-scheme:dark){:root{--bg:#1e1e1e;--bg2:#272727;--bd:rgba(255,255,255,.09);--tx:#f0f0f0;--mu:#999;--gl:#0a2e18}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg2);color:var(--tx);min-height:100vh}
a{color:var(--g)}
.wrap{max-width:860px;margin:0 auto;padding:14px}
.topbar{background:var(--gd);color:#fff;padding:14px 18px;border-radius:var(--rl) var(--rl) 0 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.tbl{display:flex;align-items:center;gap:12px}
.tbl-logo{font-size:30px;line-height:1}
.tbl-t{font-size:17px;font-weight:700}
.tbl-s{font-size:11px;color:rgba(255,255,255,.55);margin-top:2px}
.tbr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.upd{font-size:11px;color:rgba(255,255,255,.5)}
.btn-r{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:var(--r);padding:6px 13px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .15s}
.btn-r:hover{background:rgba(255,255,255,.25)}
.tabs{display:flex;background:#004a22;padding:0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 16px;font-size:13px;color:rgba(255,255,255,.6);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.tab:hover{color:rgba(255,255,255,.9)}
.tab.active{color:#fff;border-bottom-color:var(--gold);font-weight:600}
.main{background:var(--bg2);padding:16px;border-radius:0 0 var(--rl) var(--rl)}
.sec{display:none}.sec.active{display:block}
.strip{background:linear-gradient(90deg,var(--gd),var(--g));border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.s-lbl{font-size:11px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.05em}
.s-n{font-size:28px;font-weight:700;color:#fff;line-height:1.1}
.s-d{font-size:11px;color:rgba(255,255,255,.55);margin-top:2px}
.live-b{display:inline-flex;align-items:center;gap:5px;background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px}
.dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
.dlbl{font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
.game{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:11px 14px;margin-bottom:7px;display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px;transition:border-color .15s}
.game:hover{border-color:var(--g)}
.game.br{border-left:3px solid var(--g)}
.game.lv{border-color:var(--red)}
.gbg{font-size:10px;font-weight:700;background:var(--gl);color:var(--gd);padding:3px 8px;border-radius:10px;text-align:center;white-space:nowrap}
.gbg.lv{background:var(--red);color:#fff}
.gc{display:flex;align-items:center;gap:10px;justify-content:center}
.team{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;min-width:80px}
.team.r{flex-direction:row-reverse;text-align:right}
.fl{font-size:18px}
.sc{background:var(--bg2);border-radius:6px;padding:5px 11px;font-size:16px;font-weight:700;color:var(--tx);min-width:56px;text-align:center;flex-shrink:0}
.sc.lv{background:var(--red);color:#fff}
.gr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.gt{font-size:12px;color:var(--mu)}
.btag{font-size:10px;background:var(--gl);color:var(--gd);padding:2px 7px;border-radius:8px;font-weight:700}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.gcard{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.ghead{background:var(--g);color:#fff;padding:8px 12px;font-size:13px;font-weight:700}
.gtbl{width:100%;border-collapse:collapse;font-size:12px}
.gtbl th{padding:5px 8px;color:var(--mu);font-weight:600;font-size:11px;text-align:center;border-bottom:1px solid var(--bd)}
.gtbl th:first-child{text-align:left}
.gtbl td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--bd);font-size:12px}
.gtbl td:first-child{text-align:left}
.gtbl tr:last-child td{border-bottom:none}
.gtbl tr.q1 td:first-child{color:var(--g);font-weight:700}
.gtbl tr.q2 td:first-child{color:#1565c0;font-weight:700}
.gtbl tr.q3 td:first-child{color:#b07000;font-weight:600}
.pos{display:inline-flex;width:17px;height:17px;font-size:10px;border-radius:50%;align-items:center;justify-content:center;margin-right:4px;font-weight:700}
.p1{background:#c8e6c9;color:#1b5e20}.p2{background:#bbdefb;color:#0d47a1}.p3{background:#fff9c4;color:#7a5700}.p4{background:#eee;color:#666}
.bwrap{overflow-x:auto;padding-bottom:8px}
.bracket{display:flex;gap:4px;min-width:900px}
.rnd{flex:1;display:flex;flex-direction:column}
.rhead{background:var(--g);color:#fff;font-size:11px;font-weight:700;text-align:center;padding:7px 5px;border-radius:var(--r) var(--r) 0 0;line-height:1.4}
.rmatches{display:flex;flex-direction:column;flex:1;padding-top:2px}
.mwrap{display:flex;flex-direction:column;justify-content:center;flex:1;padding:3px 2px;min-height:52px}
.match{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;font-size:11px}
.mt{padding:5px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd)}
.mt:last-child{border-bottom:none}
.mt.w{font-weight:700;color:var(--g);background:rgba(0,132,61,.06)}
.mt .msc{font-size:11px;font-weight:700;color:var(--mu)}
.tbd{color:var(--mu);font-style:italic}
.src{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--mu);background:var(--bg);border:1px solid var(--bd);padding:4px 10px;border-radius:10px;margin-top:12px}
.info-box{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;font-size:13px;color:var(--mu);line-height:1.7;margin-bottom:14px}
.info-box strong{color:var(--tx)}
@media(max-width:580px){.team{min-width:55px;font-size:11px}.game{grid-template-columns:46px 1fr auto;gap:6px;padding:9px 9px}.sc{min-width:44px;font-size:13px;padding:4px 7px}.fl{font-size:14px}.wrap{padding:8px}}
</style>
</head>

    {t1:"2º A",t2:"2º C"},{t1:"2º E",t2:"2º G"},{t1:"2º I",t2:"2º K"},
    {t1:"1º B",t2:"2º D"},{t1:"1º F",t2:"2º H"},{t1:"1º J",t2:"2º L"},
    {t1:"2º B",t2:"2º F"},{t1:"2º J",t2:"3º melhor"},{t1:"1º D",t2:"3º melhor"},

// ── RENDER ───────────────────────────────────────────────────────
function cardJogo(j){
  const br = j.t1==="Brasil"||j.t2==="Brasil";
  const lv = j.st==="ao_vivo";
  const fim = j.st==="fim";
  const hoje = j.st==="hoje";
  let scoreH, badgeH, timeH;
  if(fim){
    scoreH=`<div class="sc">${j.g1} – ${j.g2}</div>`;
    timeH=`<span style="font-size:10px;color:var(--mu)">Encerrado</span>`;
  } else if(lv){
    scoreH=`<div class="sc lv">${j.g1??0} – ${j.g2??0}</div>`;
    timeH=`<span class="live-b" style="font-size:10px;padding:3px 8px"><span class="dot"></span>AO VIVO</span>`;
  } else if(hoje){
    scoreH=`<div class="sc" style="font-size:12px;color:var(--mu)">vs</div>`;
    timeH=`<span class="gt">${j.hr} ⏳</span>`;
  } else {
    scoreH=`<div class="sc" style="font-size:12px;color:var(--mu)">vs</div>`;
    timeH=`<span class="gt">${j.hr}</span>`;
  }
  badgeH=lv?`<span class="gbg lv">AO VIVO</span>`:`<span class="gbg">Grupo ${j.g}</span>`;
  return `<div class="game${br?" br":""}${lv?" lv":""}">
    ${badgeH}
    <div class="gc">
      <div class="team"><span class="fl">${j.f1}</span>${j.t1}</div>
      ${scoreH}
      <div class="team r">${j.t2}<span class="fl">${j.f2}</span></div>
    </div>
    <div class="gr">${timeH}${br?'<span class="btag">🇧🇷 Brasil</span>':''}</div>
  </div>`;
}

function renderHoje(){
  const hoje = "Sex, 12/06";
  const jogos = JOGOS.filter(j=>j.d===hoje);
  const lv = jogos.filter(j=>j.st==="ao_vivo");
  let h=`<div class="strip">
    <div><div class="s-lbl">Jogos de hoje</div><div class="s-n">${jogos.length}</div><div class="s-d">12 de junho · horário de Brasília</div></div>
    ${lv.length?`<div class="live-b"><div class="dot"></div>${lv.length} ao vivo</div>`:'<span style="font-size:12px;color:rgba(255,255,255,.6)">Nenhum ao vivo agora</span>'}
  </div>`;
  h+=`<div class="info-box">🟡 <strong>Jogo em andamento:</strong> Canadá x Bósnia (Grupo B) — 16:00h · BMO Field, Toronto</div>`;
  jogos.forEach(j=>{h+=cardJogo(j)});
  h+=`<div class="src">📅 Dados atualizados em 12/06/2026</div>`;
  document.getElementById("s-hoje").innerHTML=h;
}

function renderGrupos(){
  let h='<div class="ggrid">';
  for(const [l,d] of Object.entries(GRUPOS)){
    const ts=[...d.teams].sort((a,b)=>b.pts-a.pts||(b.gp-b.gc)-(a.gp-a.gc)||b.gp-a.gp);
    h+=`<div class="gcard"><div class="ghead">Grupo ${l}</div>
    <table class="gtbl"><thead><tr><th>Seleção</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th><th>Pts</th></tr></thead><tbody>`;
    ts.forEach((t,i)=>{
      const c=i===0?"q1":i===1?"q2":i===2?"q3":"";
      const ps=["p1","p2","p3","p4"];
      const sg=(t.gp-t.gc>=0?"+":"")+(t.gp-t.gc);
      h+=`<tr class="${c}"><td><span class="pos ${ps[i]}">${i+1}</span>${t.f} ${t.n}</td>
        <td>${t.j}</td><td>${t.v}</td><td>${t.e}</td><td>${t.d}</td>
        <td>${sg}</td><td><strong>${t.pts}</strong></td></tr>`;
    });
    h+='</tbody></table></div>';
  }
  h+='</div>';
  h+=`<div class="src">📅 Classificação atualizada após 2 jogos (11–12/06)</div>`;
  document.getElementById("s-grupos").innerHTML=h;
}

function renderJogos(){
  let h='';
  let lastD='';
  JOGOS.forEach(j=>{
    if(j.d!==lastD){h+=`<div class="dlbl">${j.d}</div>`;lastD=j.d;}
    h+=cardJogo(j);
  });
  h+=`<div class="src">📅 Calendário completo — fase de grupos (11 a 27/06)</div>`;
  document.getElementById("s-jogos").innerHTML=h;
}

function renderMata(){
  let h='<div class="info-box">🏆 <strong>32 times avançam</strong> — 2 primeiros de cada grupo + 8 melhores terceiros. Final em <strong>19/07 · MetLife Stadium, Nova York</strong></div>';
  h+='<div class="bwrap"><div class="bracket">';
  FASES_MATA.forEach(f=>{
    h+=`<div class="rnd"><div class="rhead">${f.nome}<br><span style="font-weight:400;font-size:10px">${f.datas}</span></div><div class="rmatches">`;
    f.jogos.forEach(j=>{
      h+=`<div class="mwrap"><div class="match">
        <div class="mt"><span class="tbd">${j.t1}</span></div>
        <div class="mt"><span class="tbd">${j.t2}</span></div>
      </div></div>`;
    });
    h+='</div></div>';
  });
  h+='</div></div>';
  h+=`<div class="src">📅 Mata-mata começa em 29/06</div>`;
  document.getElementById("s-mata").innerHTML=h;
}

function aba(nome,el){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  document.querySelectorAll(".sec").forEach(s=>s.classList.remove("active"));
  document.getElementById("s-"+nome).classList.add("active");
}

// Init
renderHoje();renderGrupos();renderJogos();renderMata();
document.getElementById("upd").textContent="Atualizado em 12/06/2026";
</script>
